[project]
name = "sora10chan-discord-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"discord.py>=2.6,<3",
	"davey>=0.1",
	"PyNaCl>=1.5",
	"python-dotenv>=1.0,<2",
	"fastapi>=0.115,<1",
	"requests>=2.32,<3",
	"vercel-queue>=0.9,<1",
	"yt-dlp>=2025.1.0",
	"instaloader>=4.14,<5",
]

[tool.vercel]
entrypoint = "api.interactions:app"

[[tool.vercel.subscribers]]
entrypoint = "queues.media"